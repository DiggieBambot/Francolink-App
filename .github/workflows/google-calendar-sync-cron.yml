name: Google Calendar sync

# Retries any lesson push to a tutor's Google Calendar that the confirm or
# cancel path missed. Cheap when nothing changed (no Google calls).
on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile tutor Google Calendars
        run: |
          curl -sS -X GET "https://app.francolink.net/api/cron/google-calendar-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 300 --fail-with-body
